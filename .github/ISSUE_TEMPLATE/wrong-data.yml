name: Wrong data / Неверные данные
description: A number, a card, a tier list or the odds look wrong. / Неверное число, карта, тир-лист или шансы.
labels: ["wrong data", "beta"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us where you saw it and how you know it's wrong: a screenshot next to the game, the replay or another source. The diagnostics archive (**Settings → About → Report a problem**) shows what the app read; for a number from a match, turn on "Attach game logs" (they contain BattleTags, and anyone can read this issue).

        Расскажите, где вы это увидели и откуда знаете, что это неверно: скриншот рядом с игрой, реплей или другой источник. Архив диагностики (**Настройки → О программе → Сообщить о проблеме**) показывает, что прочитало приложение; для числа из матча включите «Приложить логи игры» (в них есть BattleTag, а этот issue видят все).
  - type: input
    id: version
    attributes:
      label: Hearthpulse version / Версия Hearthpulse
      description: Settings → About, for example 0.16.0. / Настройки → О программе, например 0.16.0.
      placeholder: "0.16.0"
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Game mode / Режим игры
      options:
        - Standard or Wild / Стандартный или Вольный
        - Twist or Classic / Твист или Классический
        - Battlegrounds / Поля сражений
        - Battlegrounds Duos / Поля сражений, дуэты
        - Arena / Арена
        - Tavern Brawl / Потасовка
        - Outside a game (main window, settings) / Вне игры (главное окно, настройки)
        - Other / Другое
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system / Операционная система
      options:
        - Windows 11
        - Windows 10
        - macOS
        - Linux
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Where in the app / Где в приложении
      description: The page or overlay panel. / Страница или панель оверлея.
      placeholder: Overlay, combat odds / Оверлей, шансы в бою
    validations:
      required: true
  - type: textarea
    id: shown
    attributes:
      label: What the app shows / Что показывает приложение
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What it should be and how you know / Как должно быть и откуда это известно
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it / Как это увидеть
      placeholder: |
        1. Open Standard → Meta tier list / Открыть Стандартный → Тир-лист
        2. …
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics archive / Архив диагностики
      description: Drag hearthpulse-diagnostics-….zip here (GitHub takes up to 25 MB). / Перетащите сюда hearthpulse-diagnostics-….zip (GitHub принимает до 25 МБ).
      placeholder: hearthpulse-diagnostics-2026-11-26-1530.zip
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots / Скриншоты
